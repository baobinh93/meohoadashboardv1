<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Apple Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Mèo Hoa Admin" />

    <!-- Browser theme -->
    <meta name="theme-color" content="#211f1e" />

    <!-- iPhone Home Screen Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%admin-phone-logo.png"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <title>Mèo Hoa Admin</title>

    <!-- GitHub Pages SPA Redirect -->
    <script>
      (function () {
        var redirect = window.location.search;

        if (redirect.startsWith("?/")) {
          var decoded = redirect.slice(2).replace(/~and~/g, "&");

          window.history.replaceState(
            null,
            "",
            window.location.pathname.replace(/\/$/, "") +
              "/" +
              decoded +
              window.location.hash,
          );
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
